# From the repository root:
#   docker compose -f examples/main_demo/docker-compose.yml up --build
#
# Then open http://localhost:8080
# Stop with Ctrl+C, or run:
#   docker compose -f examples/main_demo/docker-compose.yml down

services:
  nicewidgets-demo:
    build:
      context: ../..
      dockerfile: examples/main_demo/Dockerfile
    image: nicewidgets-demo:latest
    ports:
      - "8081:8080"
    environment:
      PYTHONUNBUFFERED: "1"
      NICEWIDGETS_DEMO_HOST: "0.0.0.0"
      PORT: "8080"
