site_name: NiceWidgets
site_description: Reusable NiceGUI widgets for scientific and desktop applications.
repo_url: https://github.com/mapmanager/nicewidgets
repo_name: mapmanager/nicewidgets

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

hooks:
  - docs/hooks.py

plugins:
  - search
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - toc:
      permalink: true

exclude_docs: |
  hooks.py

nav:
  - Home: index.md
  - Examples: guide/examples.md
  - API notes: api/widget-api.md
