[project]
name = "nicewidgets"
version = "0.1.0"
description = "Reusable NiceGUI widgets for scientific and desktop applications."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Robert Cudmore", email = "robert.cudmore@gmail.com" },
]
keywords = [
    "nicegui",
    "widgets",
    "plotly",
    "aggrid",
    "scientific-visualization",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
requires-python = ">=3.12"
dependencies = [
    # NiceGUI 3.14+ matches the CloudScope floor after the Jul 2026 bump from 3.10.
    "nicegui>=3.14.0",
    # Conservative floors: APIs used are longstanding; do not mirror lockfile tips.
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "pillow>=10.0.0",
    "platformdirs>=4.0.0",
]

[project.optional-dependencies]
desktop = [
    "pyperclip",
    "pyperclipimg>=0.2.0",
    "pywebview>=6.2.1",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-section-index",
    "pymdown-extensions",
]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.11",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "desktop_extra: requires optional [desktop] extras (pyperclip, pyperclipimg, pywebview)",
]

[tool.coverage.run]
source = ["nicewidgets"]

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
ignore = ["I001"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[project.urls]
Homepage = "https://github.com/mapmanager/nicewidgets"
Repository = "https://github.com/mapmanager/nicewidgets"
Issues = "https://github.com/mapmanager/nicewidgets/issues"
Documentation = "https://mapmanager.github.io/nicewidgets/"
